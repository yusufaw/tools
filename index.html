<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tools · Yusuf</title>
  <meta name="description" content="A collection of web tools built by Yusuf — CleanURL, Gimme a Name, JSON Formatter and more." />

  <!-- Favicon: simple accent dot -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%232a737e'/%3E%3C/svg%3E" />

  <!-- Google Fonts: Space Grotesk (geometric, distinctive) + Space Mono for accents -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Shared brand accent — single source of truth for the accent color.
       Defines --accent, --accent-hover, --accent-2, --accent-rgb, etc. -->
  <link rel="stylesheet" href="https://cdn.yusufaw.me/theme.css" />

  <style>
    /* ============================================================
       DESIGN TOKENS — tweak everything from here
       ============================================================ */
    :root {
      /* Brand — pulled from the shared theme (cdn.yusufaw.me/theme.css).
         --accent itself is intentionally NOT redeclared here so the theme
         remains the single source of truth. Fallbacks degrade gracefully
         if the CDN is ever unreachable. */
      --accent-strong: var(--accent-hover, #235f69);                 /* deeper accent for text/hover */
      --accent-glow:   rgba(var(--accent-rgb, 42, 115, 126), 0.28);  /* hover glow */

      /* Surfaces — soft, airy light */
      --bg:            #f5f6fb;   /* page background */
      --bg-2:          #eceefa;   /* gradient stop */
      --surface:       rgba(255, 255, 255, 0.75);   /* card base */
      --surface-hover: rgba(255, 255, 255, 0.95);
      --border:        rgba(18, 20, 46, 0.08);
      --border-hover:  rgba(var(--accent-rgb, 42, 115, 126), 0.5);

      /* Text */
      --text:          #1a1c2e;
      --text-muted:    #5a5e78;
      --text-faint:    #9296ad;

      /* Layout */
      --radius:        18px;
      --radius-sm:     999px;
      --maxw:          1080px;
      --gap:           22px;

      /* Motion */
      --ease:          cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ============================================================
       RESET / BASE
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    a { color: inherit; text-decoration: none; }

    /* ============================================================
       ANIMATED BACKGROUND
       Layered: radial accent glows + a slowly drifting dot grid +
       a particle canvas painted by JS.
       ============================================================ */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(900px 600px at 15% -10%, rgba(var(--accent-rgb, 42, 115, 126), 0.16), transparent 60%),
        radial-gradient(800px 700px at 95% 10%, rgba(var(--accent-rgb, 42, 115, 126), 0.10), transparent 55%),
        linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);
    }

    /* Drifting dot grid */
    .bg-grid {
      position: fixed;
      inset: -40%;
      z-index: -2;
      background-image: radial-gradient(rgba(18, 20, 46, 0.07) 1px, transparent 1px);
      background-size: 34px 34px;
      animation: gridDrift 60s linear infinite;
      pointer-events: none;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 30%, #000 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 30%, #000 40%, transparent 100%);
    }
    @keyframes gridDrift {
      from { transform: translate(0, 0); }
      to   { transform: translate(34px, 34px); }
    }

    /* Particle canvas sits above the grid, below content */
    #particles {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    /* ============================================================
       LAYOUT SHELL
       ============================================================ */
    .wrap {
      width: 100%;
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ============================================================
       HERO
       ============================================================ */
    header.hero {
      padding: clamp(80px, 16vh, 160px) 0 56px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-strong);
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      margin-bottom: 28px;
    }
    .eyebrow .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent-strong);
      box-shadow: 0 0 10px var(--accent-glow);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.7); }
    }

    .hero h1 {
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 20px;
    }
    .hero h1 .grad {
      background: linear-gradient(110deg, var(--accent, #2a737e), var(--accent-2, #4f9aa6) 55%, var(--accent-strong));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p.sub {
      font-size: clamp(1rem, 2vw, 1.18rem);
      color: var(--text-muted);
      max-width: 46ch;
      margin: 0 auto;
    }

    /* ============================================================
       TOOLS GRID
       ============================================================ */
    main { padding-bottom: 80px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--gap);
    }

    /* CARD */
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 26px 24px 22px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow: hidden;
      transition:
        transform 0.45s var(--ease),
        border-color 0.45s var(--ease),
        background 0.45s var(--ease);
      /* entrance animation */
      opacity: 0;
      transform: translateY(18px);
      animation: rise 0.7s var(--ease) forwards;
    }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }

    /* Cursor-following glow (driven by JS custom props --mx/--my) */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        420px circle at var(--mx, 50%) var(--my, 0%),
        var(--accent-glow),
        transparent 42%
      );
      opacity: 0;
      transition: opacity 0.45s var(--ease);
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--border-hover);
      background: var(--surface-hover);
      box-shadow:
        0 18px 50px -22px var(--accent-glow),
        0 0 0 1px rgba(var(--accent-rgb, 42, 115, 126), 0.12) inset;
    }
    .card:hover::before { opacity: 1; }

    /* Card header row: icon + tag */
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .icon {
      width: 46px; height: 46px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(145deg, rgba(var(--accent-rgb, 42, 115, 126), 0.24), var(--accent-soft, #e2eef0));
      border: 1px solid var(--accent-border, #c2dbdf);
      color: var(--accent-strong);
      flex-shrink: 0;
    }
    .icon svg { width: 22px; height: 22px; }

    .tag {
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-strong);
      padding: 5px 11px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft, #e2eef0);
      border: 1px solid var(--accent-border, #c2dbdf);
      white-space: nowrap;
    }

    .card h2 {
      font-size: 1.32rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .card p.desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      flex-grow: 1;
    }

    /* Open button */
    .open {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      margin-top: 4px;
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--text);
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      transition: gap 0.3s var(--ease), background 0.3s var(--ease), border-color 0.3s var(--ease);
    }
    .open .arrow { transition: transform 0.3s var(--ease); }
    .card:hover .open {
      background: var(--accent, #2a737e);
      border-color: var(--accent, #2a737e);
      color: #fff;
      box-shadow: 0 8px 24px -8px var(--accent-glow);
    }
    .card:hover .open .arrow { transform: translateX(3px); }

    /* ============================================================
       FOOTER
       ============================================================ */
    footer {
      border-top: 1px solid var(--border);
      padding: 32px 0;
      text-align: center;
      color: var(--text-faint);
      font-size: 0.9rem;
    }
    footer a.heart { color: var(--accent-strong); }
    footer a.heart:hover { text-decoration: underline; }

    /* ============================================================
       RESPONSIVE — down to 375px
       ============================================================ */
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .wrap { padding: 0 18px; }
      header.hero { padding-top: clamp(64px, 12vh, 100px); }
    }

    /* Respect reduced-motion preference */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <!-- Background layers -->
  <div class="bg-layer" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>
  <canvas id="particles" aria-hidden="true"></canvas>

  <div class="wrap">
    <!-- HERO -->
    <header class="hero">
      <span class="eyebrow"><span class="dot"></span> Toolbox</span>
      <h1>A collection of <span class="grad">handy tools</span></h1>
      <p class="sub">A small, growing set of simple web tools. Free to use — pick one and go.</p>
    </header>

    <!-- TOOLS GRID -->
    <main>
      <!-- Cards are rendered from the TOOLS array below.
           To add a tool later: just add an object to that array. -->
      <section class="grid" id="grid" aria-label="Tools"></section>
    </main>
  </div>

  <!-- FOOTER -->
  <footer>
    Built by <a class="heart" href="https://yusufaw.me" target="_blank" rel="noopener noreferrer">Yusuf</a> · <span id="year"></span>
  </footer>

  <script>
    /* ============================================================
       TOOL DATA — single source of truth.
       Add a new tool by appending an object here. `icon` is an
       SVG path key from the ICONS map below (or add your own).
       ============================================================ */
    const TOOLS = [
      {
        name: 'CleanURL',
        url: 'https://cleanurl.yusufaw.me',
        desc: 'Remove tracking queries and noise from URLs so you can share clean, private links.',
        tag: 'Privacy',
        icon: 'link',
      },
      {
        name: 'Gimme a Name',
        url: 'https://gimme-a-name.yusufaw.me',
        desc: 'Generate random alias names for website registrations and throwaway sign-ups.',
        tag: 'Generator',
        icon: 'sparkles',
      },
      {
        name: 'JSON Formatter',
        url: 'https://jsonformatter.yusufaw.me',
        desc: 'Beautify, minify, and validate JSON right in your browser — fast and offline-friendly.',
        tag: 'Developer',
        icon: 'braces',
      },
      {
        name: 'Emoji Search',
        url: 'https://emoji.yusufaw.me',
        desc: 'Search emoji by keyword and copy them to your clipboard in one click.',
        tag: 'Utility',
        icon: 'smile',
      },
    ];

    /* Inline SVG icons (stroke-based, currentColor) */
    const ICONS = {
      link: '<path d="M9 15l6-6M10 6l1-1a4 4 0 015 5l-1 1M14 18l-1 1a4 4 0 01-5-5l1-1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',
      sparkles: '<path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6L12 3zM18 14l.8 2.2L21 17l-2.2.8L18 20l-.8-2.2L15 17l2.2-.8L18 14z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="none"/>',
      braces: '<path d="M8 4c-2 0-2 2-2 4s0 3-2 4c2 1 2 2 2 4s0 4 2 4M16 4c2 0 2 2 2 4s0 3 2 4c-2 1-2 2-2 4s0 4-2 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',
      smile: '<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M8.5 14.5a4.5 4.5 0 007 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/><path d="M9 9.5h.01M15 9.5h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>',
    };

    /* ---- Render cards ---- */
    const grid = document.getElementById('grid');
    grid.innerHTML = TOOLS.map((t, i) => `
      <article class="card" style="animation-delay:${i * 90}ms">
        <div class="card-top">
          <span class="icon">${'<svg viewBox="0 0 24 24">' + (ICONS[t.icon] || ICONS.link) + '</svg>'}</span>
          <span class="tag">${t.tag}</span>
        </div>
        <h2>${t.name}</h2>
        <p class="desc">${t.desc}</p>
        <a class="open" href="${t.url}" target="_blank" rel="noopener noreferrer">
          Open Tool <span class="arrow">→</span>
        </a>
      </article>
    `).join('');

    /* ---- Cursor-follow glow on cards ---- */
    grid.addEventListener('pointermove', (e) => {
      const card = e.target.closest('.card');
      if (!card) return;
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', `${e.clientX - r.left}px`);
      card.style.setProperty('--my', `${e.clientY - r.top}px`);
    });

    /* ---- Footer year ---- */
    document.getElementById('year').textContent = new Date().getFullYear();

    /* ============================================================
       PARTICLE BACKGROUND
       Lightweight floating dots that drift and connect when near.
       Skips entirely if the user prefers reduced motion.
       ============================================================ */
    (function particles() {
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReduced) return;

      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      const accentRgb = getComputedStyle(document.documentElement)
        .getPropertyValue('--accent-rgb')
        .trim() || '42, 115, 126';
      let w, h, dpr, dots;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = canvas.width = innerWidth * dpr;
        h = canvas.height = innerHeight * dpr;
        canvas.style.width = innerWidth + 'px';
        canvas.style.height = innerHeight + 'px';
        // Particle count scales with viewport, capped for performance
        const count = Math.min(70, Math.floor((innerWidth * innerHeight) / 16000));
        dots = Array.from({ length: count }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.25 * dpr,
          vy: (Math.random() - 0.5) * 0.25 * dpr,
          r: (Math.random() * 1.6 + 0.6) * dpr,
        }));
      }

      function tick() {
        ctx.clearRect(0, 0, w, h);
        const linkDist = 120 * dpr;

        for (let i = 0; i < dots.length; i++) {
          const d = dots[i];
          d.x += d.vx; d.y += d.vy;
          // wrap around edges
          if (d.x < 0) d.x = w; if (d.x > w) d.x = 0;
          if (d.y < 0) d.y = h; if (d.y > h) d.y = 0;

          // draw dot
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${accentRgb}, 0.5)`;
          ctx.fill();

          // connect to nearby dots
          for (let j = i + 1; j < dots.length; j++) {
            const o = dots[j];
            const dx = d.x - o.x, dy = d.y - o.y;
            const dist = Math.hypot(dx, dy);
            if (dist < linkDist) {
              ctx.beginPath();
              ctx.moveTo(d.x, d.y);
              ctx.lineTo(o.x, o.y);
              ctx.strokeStyle = `rgba(${accentRgb}, ${0.22 * (1 - dist / linkDist)})`;
              ctx.lineWidth = dpr;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(tick);
      }

      addEventListener('resize', resize);
      resize();
      tick();
    })();
  </script>
</body>
</html>
